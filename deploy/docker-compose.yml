# 机B 后端 docker-compose (SQLite 精简版)
name: savvy
#
# 用途: 跑在 B 云服务器 (建议 4C8G+, 不备案, 不开公网 Web)
# 服务: new-api + Redis + savvy-manager + hermes-agent
# DB:   SQLite 单文件 (日流水百万前够用, 后续迁 MySQL/PG 零改代码)
# 模型: 仅接国内已备案 AI 聚合商 (合规), 海外模型经聚合商转售, 不自建海外代理
#
# 启动: docker compose up -d
# 日志: docker compose logs -f new-api
# 停止: docker compose down
# 重建: docker compose up -d --build new-api  (改代码后)

version: '3.4'

services:

  # ============ 主SaaS后端 ============
  new-api:
    build:
      context: ../new-api
      dockerfile: Dockerfile
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    # 不绑 127.0.0.1: 机A Nginx 从内网回源要打得进来。
    # 公网暴露由机B ufw 卡来源白名单 (仅机A内网IP), 不靠端口绑定。
    # 反代由机A Nginx 终结 HTTPS 再打过来 (裸 HTTP)
    ports:
      - "3000:3000"
    volumes:
      - ./data/new-api:/data       # SQLite 文件在这里: /data/one-api.db
      - ./logs/new-api:/app/logs
    environment:
      # ---- DB (SQLite 起步) ----
      # 不设 SQL_DSN = 默认 SQLite, 文件 /data/one-api.db
      # 迁 MySQL 时改这里: - SQL_DSN=root:pwd@tcp(mysql:3306)/new-api
      # - SQL_DSN=

      # ---- Redis 缓存 ----
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:?required}@redis:6379

      # ---- 时区/日志 ----
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=savvy-prod-b

      # ---- 流式 LLM 长响应 ----
      - STREAMING_TIMEOUT=300

      # ---- Session 多机一致性 (单机可省, 留位) ----
      - SESSION_SECRET=${SESSION_SECRET:?required}

      # ---- Secure cookie (HTTPS 经机A终结) ----
      - SESSION_COOKIE_SECURE=true
      - SESSION_COOKIE_TRUSTED_URL=https://scheng.net

      # ---- Hermes/workspace 编排 (HMAC + manager URL) ----
      # Go 读 os.Getenv("SAVVY_HMAC_SECRET") (不是 SESSION_SECRET!), 与 savvy-manager 必须同值
      # 否则每个 /internal/* 401。从 .env 读, hard-fail 防漏配。
      # HERMES_MANAGER_URL 不设 → Go 默认 http://localhost:8000 (容器内回环) 连不到 savvy-manager 容器名
      - SAVVY_HMAC_SECRET=${SAVVY_HMAC_SECRET:?required}
      - HERMES_MANAGER_URL=http://savvy-manager:8000

      # ---- 海外模型合规接入位 ----
      # 走国内已备案聚合商渠道在 new-api 控制台里加渠道填聚合商的 BaseURL + Key
      # 这里不硬编码, 避免密钥入仓库
      # 例如聚合商: silverroad / aiproxy / openai-sb 国内已备案转售
      # 控制台 → 渠道 → 新建 → 类型选 OpenAI → BaseURL 填聚合商的 https://agg.xxx.com

    depends_on:
      - redis
    networks:
      - savvy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ Redis (new-api 缓存/限流) ============
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?required}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ./data/redis:/data
    networks:
      - savvy-net
    # 不开 ports, 仅容器内网可见

  # ============ savvy-manager (容器生命周期编排) ============
  # 独立 DB (不与 new-api 共库), HMAC 私有 API 与 new-api 通信
  savvy-manager:
    build:
      context: ../savvy-manager
      dockerfile: Dockerfile
    container_name: savvy-manager
    restart: always
    ports:
      - "8000:8000"   # new-api 走容器内网 savvy-manager:8000, 宿主端口留给机A/调试
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock   # 编排宿主容器 (双斜杠兼容 Windows Docker Desktop)
      - ./data/savvy-manager:/data
    environment:
      - SAVVY_DATABASE_URL=sqlite:////data/savvy-manager.db
      - SAVVY_PROVIDER_ENC_KEY=${SAVVY_PROVIDER_ENC_KEY:?required}
      # 与 new-api 必须同值 (从 .env 同一变量读)。hard-fail 防漂移。
      - SAVVY_HMAC_SECRET=${SAVVY_HMAC_SECRET:?required}
      # ponytail: 必须显式 false。config.py 默认 mock_mode=true → 不真起 Docker,
      # 启工作区全是假响应。线上 false 才真编排 workspace 容器。
      - SAVVY_MOCK_MODE=false
      - SAVVY_WORKSPACE_NETWORK=savvy_savvy-net
      - SAVVY_PUBLIC_HOST=https://scheng.net
      - SAVVY_DEBUG=true
      - TZ=Asia/Shanghai
    networks:
      - savvy-net
    # ponytail: 单机编排, worker 模式扩容时拆出单独 manager-api + worker

  # ============ 机B内部 Nginx (workspace 端口池路由) ============
  # 已有 deploy/nginx.conf: 41000-41099 端口池, token 驱动路由到 workspace 容器
  # auth_request 子请求到 savvy-manager 验 token, 拿 user_id/instance_id/upstream
  # 这是 workspace 体系核心, 不改动, 仅挂载启动
  workspace-router:
    image: nginx:1.27-alpine
    container_name: workspace-router
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "41000-41099:41000-41099"   # 机A /workspace 回源到这端口池, ufw 卡机A来源
    depends_on:
      - savvy-manager
      - new-api
    networks:
      - savvy-net

  # ============ hermes-agent (工作智能体引擎) ============
  # Python 长驻, hermes-workspace 容器池由 savvy-manager 拉起, 不在这里常驻
  # 工作智能体实际跑在 savvy-manager 拉起的 workspace 容器里 (2h 自睡 daemon)
  # this service 留作 agent core / 调度入口, 如不需要可注释
  hermes-agent:
    build:
      context: ../hermes-agent
      dockerfile: Dockerfile
    container_name: hermes-agent
    restart: always
    volumes:
      - ./data/hermes:/data
    environment:
      - TZ=Asia/Shanghai
    networks:
      - savvy-net
    profiles: ["full"]   # ponytail: 默认不启, 按需 `docker compose --profile full up`

networks:
  savvy-net:
    driver: bridge

# ponytail: SQLite 文件即在上面 ./data/new-api/one-api.db
# 备份见 backup.cron, 迁 MySQL 改 SQL_DSN 即可, 零改代码
