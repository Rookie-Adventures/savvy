# 机A Nginx 配置 (备案站 2C2G, 跑 scheng.net)
#
# 职责: 静态首页 + HTTPS终结 + 反代机B后端
# 不放任何业务逻辑, 资源消耗极小 (2C2G 富裕)
#
# 部署: sudo cp nginx-scheng.conf /etc/nginx/sites-available/scheng.net
#       sudo ln -s /etc/nginx/sites-available/scheng.net /etc/nginx/sites-enabled/
#       sudo certbot --nginx -d scheng.net -d www.scheng.net   (证书)
#       sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS 跳转 (备案核查通常走 HTTP, 保留 80)
server {
    listen 80;
    listen [::]:80;
    server_name scheng.net www.scheng.net;

    # certbot 验证留口 (ACME 续签走这)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scheng.net www.scheng.net;

    # 证书 (certbot 生成后会自动写到这里, 别手动改路径)
    ssl_certificate     /etc/letsencrypt/live/scheng.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scheng.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # 静态首页 (你重设计的 finesse 8section, 构建后产物)
    root /var/www/savvy-agent;
    index index.html;

    # 上传/包体限制 (LLM 请求体可能较大)
    client_max_body_size 50m;

    # ---------- 备案首页静态资源 ----------
    # SPA fallback: 前端 React Router, 单页应用
    location / {
        try_files $uri $uri/ /index.html;
        # 静态资源长缓存
        location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---------- new-api 管理后端 (/api/) ----------
    location /api/ {
        proxy_pass http://BACKEND_HOST:3000;   # 改成机B内网IP或VPC地址
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $https;
        proxy_http_version 1.1;
    }

    # ---------- OpenAI 兼容 API (/v1/, 用户密钥从外部工具调用) ----------
    # ChatBox/Cherry Studio 填 https://scheng.net, 自动拼 /v1/chat/completions
    location /v1/ {
        proxy_pass http://BACKEND_HOST:3000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $https;
        proxy_http_version 1.1;
        # ---- 流式 (SSE) 必备 ----
        proxy_buffering off;          # 不要缓冲, 否则流式全部攒完再吐
        proxy_cache off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;      # LLM 长响应/长思考
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # ---------- 海外聚合商合规接入位 ----------
    # new-api 控制台配聚合商渠道 (BaseURL 指聚合商 https://agg.xxx.com)
    # 这里不做事, 只是注释: 聚合商出海资质由对方扛, 你是下游分销

    # ---------- 备案信息安全头 ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# ponytail: BACKEND_HOST 用机B内网IP替换, 部署前 sed 全局换
# 同机房才走 VPC 内网直连, 异地就机B开公网IP+机A白名单
# 调整 BACKEND_HOST 后: sudo nginx -t && sudo systemctl reload nginx
