upstream newapi {
    server new-api:3000;
}

upstream savvy_manager {
    server savvy-manager:8000;
}

# Token 兜底链：query arg 优先 → cookie → Referer 里的 token。
# ponytail: 实测 auth_request 子请求上下文里 $arg_token 为空（子请求无 query args），
# 改用 $request_uri 正则提 token（主/子请求都完整）。各级 map 值不自引用源变量。
map $request_uri $ws_token_from_uri {
    default "";
    ~*[?&]token=([^&\s]+) $1;
}
map $cookie_workspace_token $ws_cookie_raw {
    default "";
    ~^(.+) $1;
}
map $http_referer $ws_token_from_ref {
    default "";
    ~*token=([^&\s]+) $1;
}
# uri 优先；uri 空 → cookie；cookie 也空 → referer。逐级链式 map，每级源变量不同。
map $ws_token_from_uri $ws_token_l1 {
    default "";
    ~^(.+) $1;
    ""     $ws_cookie_raw;
}
map $ws_token_l1 $ws_token_with_ref {
    default "";
    ~^(.+) $1;
    ""     $ws_token_from_ref;
}
# 仅当 query 带 token 时发 Set-Cookie（空字符串 → add_header 发空 Set-Cookie，浏览器忽略）
map $arg_token $ws_set_cookie {
    ""        "";
    default   "workspace_token=$arg_token; Path=/; HttpOnly; SameSite=Lax";
}
# 滑动续期：validate 临过期返回新 token 时，刷新 cookie。
# renew_token 为空 → 空 Set-Cookie → 浏览器忽略（与 $ws_set_cookie 同套路）。
map $renew_token $ws_renew_cookie {
    ""        "";
    default   "workspace_token=$renew_token; Path=/; HttpOnly; SameSite=Lax";
}

# 80 端口：new-api + savvy-manager 内部 API
server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=30s;
    client_max_body_size 100M;

    # Savvy Manager API (internal only, called by new-api backend)
    location /manager/ {
        proxy_pass http://savvy_manager/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → new-api
    location / {
        proxy_pass http://newapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# Workspace server: 端口池（41000-41099），每端口功能相同，token 驱动路由
