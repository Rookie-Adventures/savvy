    resolver 127.0.0.11 valid=30s;
    client_max_body_size 100M;

    # 启动竞态兜底：实例刚 RUNNING 但容器未就绪时 validate 返回 403，
    # 给用户一个友好的等待页（3s 自动重试），而非裸 nginx 403。
    error_page 403 = @starting;
    location @starting {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>启动中</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#e5e5e5;font-family:system-ui,sans-serif}div{text-align:center}h2{font-weight:500;font-size:1.1rem;margin-bottom:.5rem}p{color:#737373;font-size:.85rem}.spin{display:inline-block;width:28px;height:28px;border:3px solid #333;border-top-color:#e5e5e5;border-radius:50%;animation:sp .8s linear infinite;margin-bottom:1rem}@keyframes sp{to{transform:rotate(360deg)}}</style></head><body><div><div class="spin" id="sp"></div><h2 id="h">工作区启动中…</h2><p id="m">3 秒后自动重试。</p></div><script>var q=new URLSearchParams(location.search);var n=parseInt(q.get("ws_retry")||"0",10);if(n>=10){document.getElementById("sp").style.display="none";document.getElementById("h").textContent="工作区未就绪";document.getElementById("m").textContent="工作区可能尚未启动或已休眠，请回控制台点击启动后再打开。";}else{setTimeout(function(){q.set("ws_retry",String(n+1));location.search=q.toString();},3000);}</script></body></html>';
    }

    # Token 验证（auth_request 子请求在同 server 内解析）
    auth_request /validate-token;
    auth_request_set $user_id $upstream_http_x_user_id;
    auth_request_set $instance_id $upstream_http_x_instance_id;
    auth_request_set $workspace_upstream $upstream_http_x_workspace_upstream;
    auth_request_set $renew_token $upstream_http_x_renewed_token;

    location = /validate-token {
        internal;
        proxy_pass http://savvy_manager/internal/workspace/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Token $ws_token_with_ref;
        proxy_set_header X-Token-Arg $ws_token_from_uri;
        proxy_set_header X-Token-Cookie $cookie_workspace_token;
    }

    # 根路径全部代理到 workspace 容器（无前缀 strip 需求）
    location / {
        # 仅当 query 带 token 时发 Set-Cookie，使后续 /api/* 携带 cookie
        add_header Set-Cookie $ws_set_cookie always;
        # 滑动续期 cookie（仅当 validate 返回 X-Renewed-Token 时发）
        add_header Set-Cookie $ws_renew_cookie always;
        proxy_pass $workspace_upstream;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-Instance-Id $instance_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
