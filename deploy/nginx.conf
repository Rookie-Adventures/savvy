upstream newapi {
    server new-api:3000;
}

upstream savvy_manager {
    server savvy-manager:8000;
}

# Token 兜底链：query arg 优先 → cookie → Referer 头里的 query token。
# 第三道兜底为 manifest.json/favicon/sw.js 等首屏并发子资源：URL 不带 ?token=，
# 首次访问时 Set-Cookie 尚未在浏览器落地，故无 cookie。此时子资源 Referer = 首屏
# /workspace?token=xxx，从中提 token 兜底放行，根治首屏一闪 401。
# 安全边界不变：token 本就暴露在 URL（原设计接受），referer 兜底不降级。
map $cookie_workspace_token $ws_token_from_cookie {
    ""        "";
    default   $cookie_workspace_token;
}
map $arg_token $ws_token_from_arg {
    ""        $ws_token_from_cookie;
    default   $arg_token;
}
map $http_referer $ws_token_from_ref {
    default "";
    ~*token=([^&\s]+) $1;
}
map $ws_token_from_arg $ws_token_with_ref {
    default $ws_token_from_arg;
    ""      $ws_token_from_ref;
}
# 仅当 query 带 token 时发 Set-Cookie（空字符串 → add_header 发空 Set-Cookie，浏览器忽略）
map $arg_token $ws_set_cookie {
    ""        "";
    default   "workspace_token=$arg_token; Path=/; HttpOnly; SameSite=Lax";
}

# 80 端口：new-api + savvy-manager 内部 API
server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=30s;
    client_max_body_size 100M;

    # Savvy Manager API (internal only, called by new-api backend)
    location /manager/ {
        proxy_pass http://savvy_manager/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → new-api
    location / {
        proxy_pass http://newapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# Workspace server: 端口池（41000-41099），每端口功能相同，token 驱动路由
# 每 workspace 实例分一个端口，workspace 占该端口根路径，前端 /api/* 同源命中此 server 块
