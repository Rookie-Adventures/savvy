    listen 41072;
    listen 41073;
    listen 41074;
    listen 41075;
    listen 41076;
    listen 41077;
    listen 41078;
    listen 41079;
    listen 41080;
    listen 41081;
    listen 41082;
    listen 41083;
    listen 41084;
    listen 41085;
    listen 41086;
    listen 41087;
    listen 41088;
    listen 41089;
    listen 41090;
    listen 41091;
    listen 41092;
    listen 41093;
    listen 41094;
    listen 41095;
    listen 41096;
    listen 41097;
    listen 41098;
    listen 41099;

    resolver 127.0.0.11 valid=30s;
    client_max_body_size 100M;

    # Token 验证（auth_request 子请求在同 server 内解析）
    auth_request /validate-token;
    auth_request_set $user_id $upstream_http_x_user_id;
    auth_request_set $instance_id $upstream_http_x_instance_id;
    auth_request_set $workspace_upstream $upstream_http_x_workspace_upstream;

    location = /validate-token {
        internal;
        proxy_pass http://savvy_manager/internal/workspace/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Token $ws_token_with_ref;
    }

    # 根路径全部代理到 workspace 容器（无前缀 strip 需求）
    location / {
        # 仅 query 带 token 时发 Set-Cookie，使后续 /api/* 携带 cookie
        add_header Set-Cookie $ws_set_cookie always;
        proxy_pass $workspace_upstream;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-Instance-Id $instance_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
