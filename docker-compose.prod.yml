# Savvy Agent - Production Stack
# Usage: docker compose -f docker-compose.prod.yml up -d
# Access: http://your-domain.com

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
      - "41000-41099:41000-41099"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      - new-api
      - savvy-manager
    networks:
      - savvy-net
    restart: unless-stopped

  new-api:
    build:
      context: ./new-api
      dockerfile: Dockerfile
    container_name: new-api
    restart: unless-stopped
    environment:
      - SQL_DSN=postgresql://newapi:123456@newapi-db:5432/new-api
      - REDIS_CONN_STRING=redis://:123456@redis:6379
      - SESSION_SECRET=change-me-in-production
      - SAVVY_HMAC_SECRET=${SAVVY_HMAC_SECRET:?required}
      - HERMES_MANAGER_URL=http://savvy-manager:8000
      - SERVER_ADDRESS=http://localhost:3000
    depends_on:
      newapi-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - savvy-net

  newapi-db:
    image: postgres:15
    container_name: newapi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: new-api
    volumes:
      - newapi-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newapi -d new-api"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - savvy-net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "123456"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - savvy-net

  savvy-manager:
    build:
      context: ./savvy-manager
      dockerfile: Dockerfile
    container_name: savvy-manager
    restart: unless-stopped
    volumes:
      # ponytail: 挂宿主 docker.sock — manager 要管 workspace 容器生命周期
      # (docker.from_env() → /var/run/docker.sock)。Windows Docker Desktop 双斜杠法。
      - //var/run/docker.sock:/var/run/docker.sock
    environment:
      - SAVVY_DATABASE_URL=postgresql://savvy:savvy123@manager-db:5432/savvy_manager
      - SAVVY_HMAC_SECRET=${SAVVY_HMAC_SECRET:?required}
      - SAVVY_MOCK_MODE=false
      - SAVVY_PUBLIC_HOST=localhost
      - SAVVY_WORKSPACE_PORT_START=41000
      - SAVVY_WORKSPACE_PORT_END=41099
      - SAVVY_WORKSPACE_NETWORK=savvy_savvy-net
      - SAVVY_DEBUG=false
      # Provider-config encryption key (32-byte urlsafe base64). Bare ${...} so
      # compose startup fails loudly if operator forgot to set it (belt-and-
      # suspenders with the startup guard in app/main.py).
      - SAVVY_PROVIDER_ENC_KEY=${SAVVY_PROVIDER_ENC_KEY}
      # ponytail: SAVVY_OPENAI_BASE_URL 不覆盖 — 代码默认 http://new-api:3000/v1
      # (app/config.py) 容器间直连,本机+服务器同栈都通。上线需走真域名再在此覆盖。
      - SAVVY_PROVIDER_DEFAULT_MODEL=claude-sonnet-4
    depends_on:
      manager-db:
        condition: service_healthy
    networks:
      - savvy-net

  manager-db:
    image: postgres:15
    container_name: manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: savvy
      POSTGRES_PASSWORD: "savvy123"
      POSTGRES_DB: savvy_manager
    volumes:
      - manager-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savvy -d savvy_manager"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - savvy-net

volumes:
  newapi-pg-data:
  manager-pg-data:
  redis-data:

networks:
  savvy-net:
    driver: bridge
