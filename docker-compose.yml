# Savvy Agent - Local Development Stack
# Usage: docker compose up -d
# Access: http://localhost

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "41000-41099:41000-41099"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - new-api
      - savvy-manager
    networks:
      - savvy-net

  new-api:
    build:
      context: ./new-api
      dockerfile: Dockerfile
    container_name: new-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - SQL_DSN=postgresql://newapi:123456@newapi-db:5432/new-api
      - REDIS_CONN_STRING=redis://:123456@redis:6379
      - SAVVY_HMAC_SECRET=${SAVVY_HMAC_SECRET:-dev-hmac-secret-change-me}
      - HERMES_MANAGER_URL=http://savvy-manager:8000
      # 本地验收放宽 Critical 档限流(默认 20次/20min/IP 且所有 CT 接口共享计数,Redis 持久化重启不清);
      # 生产走 prod compose 自己的默认值,不受此处影响
      - CRITICAL_RATE_LIMIT=${CRITICAL_RATE_LIMIT:-200}
      # 蚂蚁链链证(段2b) — 真值在根 .env (gitignored); 空默认 = 链证禁用(fail-closed)
      - ANTCHAIN_ENABLED=${ANTCHAIN_ENABLED:-false}
      - ANTCHAIN_ACCESS_ID=${ANTCHAIN_ACCESS_ID:-}
      - ANTCHAIN_ACCESS_SECRET_FILE=${ANTCHAIN_ACCESS_SECRET_FILE:-}
      - ANTCHAIN_REST_URL=${ANTCHAIN_REST_URL:-https://rest.baas.alipay.com}
      - ANTCHAIN_KMS_ID=${ANTCHAIN_KMS_ID:-}
      - ANTCHAIN_ACCOUNT=${ANTCHAIN_ACCOUNT:-}
      - ANTCHAIN_CONTRACT_NAME=${ANTCHAIN_CONTRACT_NAME:-}
      - ANTCHAIN_GAS=${ANTCHAIN_GAS:-500000}
      - ANTCHAIN_BIZ_ID=${ANTCHAIN_BIZ_ID:-}
      - ANTCHAIN_TENANT_ID=${ANTCHAIN_TENANT_ID:-}
    volumes:
      # 蚂蚁链 access.key 只读挂载(本地在 E:\mayilian\access.key, 容器内 /secrets/... 对齐机B生产路径)
      - ${ANTCHAIN_ACCESS_KEY_HOST_PATH:-E:/mayilian/access.key}:/secrets/antchain-access.key:ro
    depends_on:
      newapi-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - savvy-net

  newapi-db:
    image: postgres:15
    container_name: newapi-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: new-api
    volumes:
      - newapi-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newapi -d new-api"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - savvy-net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "123456"]
    networks:
      - savvy-net

  savvy-manager:
    build:
      context: ./savvy-manager
      dockerfile: Dockerfile
    container_name: savvy-manager
    restart: unless-stopped
    environment:
      - SAVVY_DATABASE_URL=postgresql://savvy:savvy123@manager-db:5432/savvy_manager
      - SAVVY_HMAC_SECRET=${SAVVY_HMAC_SECRET:-dev-hmac-secret-change-me}
      - SAVVY_MOCK_MODE=false
      - SAVVY_WORKSPACE_NETWORK=savvy_savvy-net
      # 从根 .env 读; 需带协议前缀(http://localhost 走 token.py if 分支,
      # 避免被强制套 https:// 触发浏览器 ERR_SSL_PROTOCOL_ERROR)。prod=https://scheng.net
      - SAVVY_PUBLIC_HOST=${SAVVY_PUBLIC_HOST:-http://localhost}
      - SAVVY_WORKSPACE_PORT_START=41000
      - SAVVY_WORKSPACE_PORT_END=41099
      - SAVVY_DEBUG=true
      # Provider-config encryption key (32-byte urlsafe base64). dev default-empty
      # so the starter works without it; prod uses bare ${...} (fail-closed).
      - SAVVY_PROVIDER_ENC_KEY=${SAVVY_PROVIDER_ENC_KEY:-}
      - SAVVY_OPENAI_BASE_URL=http://new-api:3000/v1
      - SAVVY_PROVIDER_DEFAULT_MODEL=claude-sonnet-4
    volumes:
      # Mount the Docker socket so the manager can start/stop workspace
      # containers on the host. Double-slash prefix works on Docker Desktop
      # for Windows (named-pipe / socket path translation).
      - //var/run/docker.sock:/var/run/docker.sock
    depends_on:
      manager-db:
        condition: service_healthy
    networks:
      - savvy-net

  manager-db:
    image: postgres:15
    container_name: manager-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: savvy
      POSTGRES_PASSWORD: "savvy123"
      POSTGRES_DB: savvy_manager
    volumes:
      - manager-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savvy -d savvy_manager"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - savvy-net

volumes:
  # 复用 7 天前容器遗留的旧 pg 卷(new-api_pg_data), 保留沙箱支付密钥/用户/初始化数据。
  newapi-pg-data:
    external: true
    name: new-api_pg_data
  manager-pg-data:

networks:
  savvy-net:
    driver: bridge
