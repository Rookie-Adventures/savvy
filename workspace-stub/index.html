<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Savvy Workspace Stub</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9;
               display: flex; flex-direction: column; align-items: center; justify-content: center;
               height: 100vh; margin: 0; }
        .ok { color: #3fb950; font-size: 3rem; }
        .box { background: #161b22; padding: 2rem 3rem; border-radius: 12px; border: 1px solid #30363d; }
        code { background: #21262d; padding: 0.2em 0.4em; border-radius: 4px; color: #79c0ff; }
    </style>
</head>
<body>
    <div class="box">
        <div class="ok">&#10004; Workspace container reachable</div>
        <p>Path served: <code id="path"></code></p>
        <p>Container hostname: <code id="host"></code></p>
        <p style="color:#8b949e; font-size:0.85rem;">Savvy workspace stub placeholder.
           Full chain works: Browser &rarr; Nginx &rarr; Manager (token OK) &rarr; this container.</p>
    </div>
    <script>
        document.getElementById('path').textContent = location.pathname + location.search;
        fetch('/__whoami').then(r=>r.text()).then(t=>{
            document.getElementById('host').textContent = t;
        }).catch(()=>{
            document.getElementById('host').textContent = navigator.userAgent;
        });
    </script>
</body>
</html>
