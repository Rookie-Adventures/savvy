server {
    listen 3000;
    server_name _;

    # Return the container's hostname so the stub page can prove which
    # workspace container actually served the request.
    location = /__whoami {
        add_header Content-Type text/plain;
        return 200 "$hostname";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
